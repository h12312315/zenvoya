<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenvoya — Group chat prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&icon_names=add,arrow_drop_down,arrow_upward,attach_money,bookmark,calendar_today,chat_bubble,check,chevron_left,chevron_right,close,delete,description,flight,group,home,hotel,keyboard_arrow_down,keyboard_arrow_up,left_panel_close,left_panel_open,mic,more_horiz,person,schedule,shopping_cart,star,thumb_down,thumb_up&display=block">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="zenvoya-figma.css">
</head>
<body data-page="home">

<div class="app">
  <nav class="side" aria-label="Main">
    <img class="zoya" src="images/figma/zoya.png" alt="Zenvoya">
    <div class="side-nav">
      <button class="nav-item" data-act="nav" data-page="home"><span class="ms" aria-hidden="true">home</span>Home</button>
      <button class="nav-item" data-act="nav" data-page="chat"><span class="ms" aria-hidden="true">chat_bubble</span>Chat</button>
      <button class="nav-item" data-act="nav" data-page="shop"><span class="ms" aria-hidden="true">shopping_cart</span>Shop</button>
      <button class="nav-item" data-act="nav" data-page="trips"><span class="ms" aria-hidden="true">bookmark</span>Trips</button>
      <button class="nav-item" data-act="nav" data-page="friends"><span class="ms" aria-hidden="true">group</span>Friends</button>
    </div>
  </nav>

  <div class="main">
    <header class="topbar">
      <h1 id="title">Home</h1>
      <div class="topbar-right">
        <button class="cart-btn" data-act="cart" aria-label="Open cart"><span class="ms s22" aria-hidden="true">shopping_cart</span><span class="cart-badge" id="cartBadge">0</span></button>
        <span class="av me-top" style="--s:24px;background:#000;font-size:16px" title="George">G</span>
      </div>
    </header>
    <div class="page" id="page"></div>
  </div>
</div>

<aside class="cart" id="cart" aria-label="Cart"></aside>
<div class="pop" id="pop" role="dialog"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="filePick" multiple hidden>

<script src="zenvoya-groupchat-data.js"></script>
<script src="zenvoya-groupchat.js"></script>
</body>
</html>
