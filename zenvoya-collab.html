<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenvoya — Plan Together</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="zenvoya-tokens.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body {
  font-family: var(--font-body);
  background: var(--color-white);
  color: var(--color-gray-900);
  height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font-family: var(--font-body); }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

#app { display: flex; height: 100dvh; width: 100%; position: relative; }

/* ===================== ICON RAIL ===================== */
.rail {
  width: 76px;
  flex-shrink: 0;
  border-right: 1px solid var(--color-gray-200);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px 0;
  gap: 6px;
}
.rail-logo {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--color-primary);
  color: var(--color-white);
  font-weight: 700;
  font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px;
}
.rail-item {
  width: 60px;
  padding: 8px 0 6px;
  border: none;
  background: none;
  border-radius: var(--radius-md);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 12px;
  font-weight: 500;
  color: var(--color-gray-600);
  cursor: pointer;
}
.rail-item:hover { background: var(--color-gray-100); }
.rail-item.active { color: var(--color-primary); font-weight: 600; }
.rail-item.active .rail-icon { background: var(--color-primary-ultra-light); }
.rail-icon { width: 40px; height: 30px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; }
.rail-spacer { flex: 1; }
.user-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--color-accent-green);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 14px;
  color: var(--color-gray-800);
}

/* ===================== CHAT LIST ===================== */
.chatlist {
  width: 252px;
  flex-shrink: 0;
  padding: 16px 12px 16px 16px;
  display: flex;
  flex-direction: column;
}
.chatlist.collapsed { display: none; }
.chatlist-inner {
  flex: 1;
  border: 1px solid var(--color-gray-200);
  border-radius: var(--radius-xl);
  padding: 14px 10px;
  display: flex; flex-direction: column;
  min-height: 0;
}
.chatlist-top { display: flex; align-items: center; gap: 8px; padding: 0 2px 12px; }
.new-chat-btn {
  flex: 1;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 12px;
  border: 1px solid var(--color-gray-300);
  border-radius: var(--radius-full);
  background: var(--color-white);
  font-size: 14px; font-weight: 600;
  color: var(--color-gray-900);
  cursor: pointer;
}
.new-chat-btn:hover { background: var(--color-gray-50); }
.icon-btn {
  width: 32px; height: 32px;
  border: none; background: none;
  border-radius: var(--radius-md);
  color: var(--color-gray-600);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.icon-btn:hover { background: var(--color-gray-100); color: var(--color-gray-900); }
.chatlist-label { font-size: 12px; font-weight: 600; color: var(--color-gray-500); padding: 12px 10px 6px; }
.chatlist-items { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.chatlist-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 10px;
  border-radius: var(--radius-md);
  font-size: 14px;
  color: var(--color-gray-700);
  cursor: pointer;
  border: none; background: none; text-align: left; width: 100%;
}
.chatlist-item:hover { background: var(--color-gray-50); }
.chatlist-item.active { background: var(--color-gray-100); color: var(--color-gray-900); font-weight: 500; }
.chatlist-item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chatlist-item-icon { display: flex; color: var(--color-gray-400); flex-shrink: 0; }
.unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-accent-blue); flex-shrink: 0; }

/* ===================== CHAT COLUMN ===================== */
.chat-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 24px 10px;
  max-width: 760px; width: 100%; margin: 0 auto;
}
.chat-header-main { flex: 1; min-width: 0; }
.chat-title { font-size: 18px; font-weight: 700; color: var(--color-gray-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-sub { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--color-gray-500); margin-top: 4px; }
.chat-sub .avatar-stack .stack-avatar, .chat-sub .avatar-stack .zoya-mini { width: 20px; height: 20px; font-size: 9px; }

.chatlist-avatars .stack-avatar { width: 18px; height: 18px; font-size: 8px; border-width: 1.5px; margin-left: -6px; }
.chatlist-avatars .stack-avatar:first-child { margin-left: 0; }
.tab-menu {
  position: absolute;
  top: calc(100% + 6px);
  min-width: 260px;
  background: var(--color-white);
  border: 1px solid var(--color-gray-200);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-large);
  padding: 6px;
  z-index: 50;
  display: none;
}
.tab-menu.open { display: block; animation: popIn 0.15s ease; }
@keyframes popIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.menu-label { font-size: 11px; font-weight: 600; color: var(--color-gray-400); padding: 8px 10px 4px; }
.menu-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border: none; background: none;
  border-radius: var(--radius-md);
  text-align: left;
  cursor: pointer;
}
.menu-item:hover { background: var(--color-gray-50); }
.menu-item-icon { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--color-gray-100); color: var(--color-gray-700); flex-shrink: 0; }
.menu-item-icon .zoya-avatar, .menu-item-icon .friend-avatar { width: 28px; height: 28px; }
.menu-item-title { font-size: 13px; font-weight: 600; color: var(--color-gray-900); }
.menu-item-desc { font-size: 12px; color: var(--color-gray-500); margin-top: 1px; line-height: 1.35; }
.menu-item.selected .menu-item-check { opacity: 1; }
.menu-item-check { margin-left: auto; color: var(--color-primary); opacity: 0; display: flex; }

/* Messages */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex; flex-direction: column; gap: 14px;
}
.chat-messages > * { max-width: 712px; width: 100%; margin-left: auto; margin-right: auto; }
.message { display: flex; gap: 10px; align-items: flex-start; }
.message.is-new { animation: messageIn 0.35s ease; }
@keyframes messageIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.message.me { justify-content: flex-end; }
.message-avatar { width: 28px; height: 28px; flex-shrink: 0; display: flex; }
.message-avatar .friend-avatar { width: 28px; height: 28px; font-size: 11px; }
.message.grouped .message-avatar { visibility: hidden; }
.zoya-avatar { width: 28px; height: 28px; display: block; }
.zoya-mini { width: 16px; height: 16px; border-radius: 50%; overflow: hidden; display: inline-flex; flex-shrink: 0; }
.zoya-mini .zoya-avatar { width: 100%; height: 100%; }
.message-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: 82%; }
.message.me .message-col { align-items: flex-end; }
.message-col.wide { max-width: 100%; flex: 1; }
.message-name { font-size: 12px; font-weight: 600; color: var(--color-gray-500); padding-left: 2px; }
.message-bubble {
  padding: 9px 14px;
  border-radius: var(--radius-lg);
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.message.bot .message-bubble { padding: 4px 0; }
.message.friend .message-bubble { background: var(--color-gray-50); border: 1px solid var(--color-gray-200); border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg); }
.message.me .message-bubble { background: var(--color-gray-100); border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg); }
.mention { font-weight: 600; color: var(--color-gray-900); background: var(--color-gray-200); border-radius: 4px; padding: 0 3px; }
.message-meta { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--color-gray-400); }

.sys-line {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 12px; color: var(--color-gray-500);
  text-align: center;
}
.sys-line.is-new { animation: messageIn 0.35s ease; }
.sys-line svg { color: var(--color-gray-400); flex-shrink: 0; }
.sys-line b { color: var(--color-gray-800); font-weight: 600; }
.sys-link { border: none; background: none; font-size: 12px; font-weight: 600; color: var(--color-gray-900); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip {
  padding: 6px 12px;
  border: 1px solid var(--color-gray-300);
  border-radius: var(--radius-full);
  background: var(--color-white);
  font-size: 13px; font-weight: 500;
  color: var(--color-gray-800);
  cursor: pointer;
}
.chip:hover { background: var(--color-gray-50); border-color: var(--color-gray-400); }
.chip:disabled { opacity: 0.45; cursor: default; }

/* Destination options (gray container) */
.dest-wrap {
  background: var(--color-gray-100);
  border-radius: 20px;
  padding: 14px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 12px;
}
.dest-wrap.is-new { animation: messageIn 0.35s ease; }
.dest-card {
  border: none; background: none;
  text-align: left; cursor: pointer;
  border-radius: var(--radius-lg);
  padding: 0;
  min-width: 0;
}
.dest-photo {
  height: 148px;
  border-radius: var(--radius-lg);
  background: var(--color-gray-200) center/cover no-repeat;
  border: 2px solid transparent;
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
}
.dest-card:hover .dest-photo { transform: translateY(-2px); box-shadow: var(--shadow-medium); }
.dest-card.selected .dest-photo { border-color: var(--color-primary); box-shadow: 0 0 0 2px var(--color-white) inset; }
.dest-price {
  position: absolute; right: 8px; bottom: 8px;
  padding: 4px 9px;
  border-radius: var(--radius-full);
  background: rgba(255,255,255,0.94);
  font-size: 12px; font-weight: 600; color: var(--color-gray-900);
}
.dest-info { display: flex; align-items: flex-start; gap: 8px; padding: 8px 2px 0; }
.dest-info-text { flex: 1; min-width: 0; }
.dest-name { font-size: 15px; font-weight: 600; color: var(--color-gray-900); }
.dest-country { font-size: 13px; color: var(--color-gray-500); }
.dest-dates { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 12px; font-weight: 500; color: var(--color-gray-700); }
.dest-dates svg { color: var(--color-gray-500); }
.dest-arrow { color: var(--color-gray-300); display: flex; padding-top: 3px; }
.dest-card.selected .dest-arrow, .dest-card:hover .dest-arrow { color: var(--color-primary); }

/* Drafting + trip card */
.draft-card, .trip-card {
  border: 1px solid var(--color-gray-200);
  border-radius: var(--radius-lg);
  background: var(--color-white);
  overflow: hidden;
}
.draft-card { padding: 14px 16px; }
.draft-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.draft-step { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--color-gray-400); padding: 4px 0; }
.draft-step.done { color: var(--color-gray-800); }
.draft-step.current { color: var(--color-gray-800); }
.draft-step-icon { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--color-gray-300); flex-shrink: 0; }
.draft-step.done .draft-step-icon { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-white); }
.draft-step.current .draft-step-icon { border-color: var(--color-gray-900); border-top-color: transparent; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.trip-card { display: flex; align-items: center; gap: 12px; padding: 10px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.2s; }
.trip-card:hover { border-color: var(--color-gray-400); box-shadow: var(--shadow-small); }
.trip-card-thumb { width: 64px; height: 64px; border-radius: var(--radius-md); background: var(--color-gray-200) center/cover no-repeat; flex-shrink: 0; }
.trip-card-body { flex: 1; min-width: 0; }
.trip-card-name { font-size: 14px; font-weight: 600; }
.trip-card-meta { font-size: 12px; color: var(--color-gray-500); margin-top: 2px; }
.trip-card-tags { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  background: var(--color-gray-100);
  font-size: 11px; font-weight: 600; color: var(--color-gray-700);
}
.tag.dark { background: var(--color-primary); color: var(--color-white); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px;
  border: 1px solid var(--color-gray-300);
  border-radius: var(--radius-full);
  background: var(--color-white);
  font-size: 13px; font-weight: 600;
  color: var(--color-gray-900);
  cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--color-gray-50); }
.btn.primary { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-white); }
.btn.primary:hover { background: var(--color-primary-hover); }
.btn.ghost { border-color: transparent; background: var(--color-gray-100); }
.btn.ghost:hover { background: var(--color-gray-200); }

.update-card {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--color-gray-200);
  border-radius: var(--radius-md);
  background: var(--color-white);
  font-size: 13px;
  max-width: 420px;
}
.update-card-thumb { width: 36px; height: 36px; border-radius: 8px; background: var(--color-gray-200) center/cover no-repeat; flex-shrink: 0; }
.update-card-body { flex: 1; min-width: 0; }
.update-card-title { font-weight: 600; color: var(--color-gray-900); }
.update-card-meta { font-size: 12px; color: var(--color-gray-500); }

.typing { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--color-gray-500); }
.typing-dots { display: inline-flex; gap: 3px; padding: 10px 12px; background: var(--color-gray-50); border: 1px solid var(--color-gray-200); border-radius: var(--radius-lg); }
.typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--color-gray-400); animation: blink 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }

/* Composer */
.composer-area { padding: 8px 24px 20px; }
.composer-area > * { max-width: 712px; margin: 0 auto; }
.composer {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--color-gray-200);
  border-radius: var(--radius-full);
  padding: 6px 6px 6px 18px;
  background: var(--color-white);
  box-shadow: var(--shadow-xsmall);
  transition: border-color 0.15s;
  position: relative;
}
.composer:focus-within { border-color: var(--color-primary); }
.composer.has-audience { padding-left: 6px; }
.composer-input {
  flex: 1; min-width: 0;
  border: none; outline: none;
  font-size: 14px; font-family: var(--font-body);
  background: transparent;
  color: var(--color-gray-900);
  padding: 10px 0;
}
.composer-input::placeholder { color: var(--color-gray-400); }
.send-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--color-primary);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--color-white);
  flex-shrink: 0;
}
.send-btn:hover { background: var(--color-primary-hover); }
.audience-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 10px 8px 8px;
  border: none;
  border-radius: var(--radius-full);
  background: var(--color-gray-100);
  font-size: 13px; font-weight: 600;
  color: var(--color-gray-800);
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
.audience-btn:hover { background: var(--color-gray-200); }
.audience-btn.with-zoya { background: var(--color-primary); color: var(--color-white); }
.audience-btn .stack-avatar { width: 18px !important; height: 18px !important; font-size: 8px !important; margin-left: -6px !important; border-width: 1.5px !important; }
.audience-btn .stack-avatar:first-child { margin-left: 0 !important; }
.audience-btn.with-zoya .stack-avatar { border-color: var(--color-primary) !important; }
.audience-btn .zoya-mini { width: 18px; height: 18px; box-shadow: 0 0 0 1.5px var(--color-white); }
.audience-menu { bottom: calc(100% + 8px); top: auto; left: 0; min-width: 300px; }
.composer-hint { font-size: 12px; color: var(--color-gray-400); margin-top: 8px; padding-left: 18px; display: flex; align-items: center; gap: 6px; }

/* ===================== TRIP PANEL ===================== */
.trip-panel {
  display: none;
  flex: 0 0 min(46%, 640px);
  min-width: 440px;
  padding: 16px 16px 16px 4px;
}
.trip-panel.open { display: flex; animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
.trip-panel.wide {
  /* Shared plan with the group chat open: three columns side by side —
     private chat | group chat | plan. */
  flex-basis: min(64%, 1240px);
  min-width: 0;
}
@media (min-width: 901px) { .chat-col { min-width: 340px; } }
.tp-card {
  flex: 1;
  min-width: 0;
  display: flex;
  border: 1px solid var(--color-gray-200);
  border-radius: 20px;
  box-shadow: var(--shadow-large);
  overflow: hidden;
  position: relative;
  background: var(--color-white);
}
.tp-plan { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; position: relative; }

/* Group chat column (shared plans only) */
.tp-group { display: none; flex: 1 1 0; min-width: 0; flex-direction: column; border-right: 1px solid var(--color-gray-200); background: var(--color-gray-50); }
.tp-card.group-open .tp-group { display: flex; flex: 0.85 1 0; animation: groupIn 0.3s ease; }
.tp-card.group-open .tp-plan { flex: 1.15 1 0; }
.tp-card.group-open .tp-thumb { width: 72px; height: 72px; }
.tp-card.group-open .tp-title { font-size: 22px; }
.tp-card.group-open .tp-body { padding: 18px 18px 24px; }
@keyframes groupIn { from { opacity: 0; } to { opacity: 1; } }
.tp-group-head { display: flex; align-items: flex-start; gap: 10px; }
.tp-group-head-main { flex: 1; min-width: 0; }
.tp-float.as-btn { border: none; cursor: pointer; font-family: var(--font-body); }
.tp-float.as-btn:hover { background: var(--color-gray-50); }
.tp-float .avatar-stack .stack-avatar { width: 18px; height: 18px; font-size: 8px; border-width: 1.5px; margin-left: -6px; }
.tp-float .avatar-stack .stack-avatar:first-child { margin-left: 0; }
.tp-float-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-full); background: var(--color-accent-blue); color: var(--color-white); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.tp-group-head { padding: 18px 18px 12px; border-bottom: 1px solid var(--color-gray-200); background: var(--color-white); }
.tp-group-title { font-size: 16px; font-weight: 700; color: var(--color-gray-900); }
.tp-group .chat-sub .avatar-stack .stack-avatar, .tp-group .chat-sub .avatar-stack .zoya-mini { width: 20px; height: 20px; font-size: 9px; }
.tp-group .chat-messages { padding: 16px; gap: 12px; }
.tp-group .message-col { max-width: 88%; }
.tp-group .message.me .message-bubble { background: var(--color-gray-200); }
.tp-group .message.friend .message-bubble, .tp-group .typing-dots { background: var(--color-white); }
.tp-group .trip-card { padding: 8px; gap: 10px; }
.tp-group .trip-card-thumb { width: 48px; height: 48px; }
.tp-group .composer-area { padding: 8px 14px 14px; }
.tp-group .composer-hint { padding-left: 14px; }
.tp-card .tp-mswitch { display: none; }
.tp-map-wrap { position: relative; }
.tp-map { height: 260px; background: var(--color-gray-100); }
.tp-map .maplibregl-map { font-family: var(--font-body); }
.tp-map .maplibregl-ctrl-group { border-radius: var(--radius-md); box-shadow: var(--shadow-small); }
.map-pin { cursor: pointer; }

}

.share-banner {
  display: flex; align-items: center; gap: 12px;

}
.share-banner-icon { width: 34px; height: 34px; border-radius: 50%; background: var(--color-white); border: 1px solid var(--color-gray-200); display: flex; align-items: center; justify-content: center; color: var(--color-gray-700); flex-shrink: 0; }
.share-banner-text { flex: 1; min-width: 0; font-size: 13px; color: var(--color-gray-600); line-height: 1.4; }

.tp-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--color-gray-200); margin: 20px 0 16px; overflow-x: auto; scrollbar-width: none; }

}

/* Itinerary day rows (Figma) */
.day-row {

.day-row-head {

}
.day-row-head:hover { background: var(--color-gray-50); }
.day-date { font-size: 14px; font-weight: 600; color: var(--color-gray-900); width: 92px; flex-shrink: 0; }
.day-loc { flex: 1; min-width: 0; font-size: 14px; color: var(--color-gray-700); }
.day-count { font-size: 12px; color: var(--color-gray-400); }
.day-icon { display: flex; color: var(--color-gray-900); }
.day-chev { display: flex; color: var(--color-gray-600); transition: transform 0.25s; }

.day-body { padding: 0 18px 16px; display: none; }
.day-row.open .day-body { display: block; }
.act {

}

.act-thumb { width: 52px; height: 52px; border-radius: 14px; background: var(--color-gray-200) center/cover no-repeat; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--color-gray-600); }
.act-body { flex: 1; min-width: 0; }
.act-time { font-size: 11px; font-weight: 600; color: var(--color-gray-500); }
.act-title { font-size: 14px; font-weight: 600; color: var(--color-gray-900); }
.act-desc { font-size: 12px; color: var(--color-gray-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.act-by { display: flex; align-items: center; flex-shrink: 0; }
.act-by .stack-avatar { width: 22px; height: 22px; font-size: 9px; }
.act-by .zoya-mini { width: 22px; height: 22px; }
.act-remove { opacity: 0; }
.act:hover .act-remove, .act-remove:focus-visible { opacity: 1; }
.add-act-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 8px;
  padding: 7px 12px;
  border: 1px dashed var(--color-gray-300);
  border-radius: var(--radius-full);
  background: var(--color-white);
  font-size: 13px; font-weight: 500;
  color: var(--color-gray-700);
  cursor: pointer;
}
.add-act-btn:hover { border-color: var(--color-gray-500); color: var(--color-gray-900); }
.add-panel { margin-top: 10px; padding: 12px; background: var(--color-gray-50); border-radius: var(--radius-md); }
.add-panel-label { font-size: 12px; font-weight: 600; color: var(--color-gray-600); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.add-panel-row { display: flex; gap: 8px; margin-top: 10px; }
.text-input {
  flex: 1; min-width: 0;
  padding: 9px 12px;
  border: 1px solid var(--color-gray-200);
  border-radius: var(--radius-full);
  font-size: 13px; font-family: var(--font-body);
  background: var(--color-white);
  outline: none;
}
.text-input:focus { border-color: var(--color-primary); }
.empty-day { font-size: 13px; color: var(--color-gray-500); padding: 6px 0; }

/* About */
.about-lede { font-size: 15px; line-height: 1.65; color: var(--color-gray-700); }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 18px 0 6px; }
.fact { background: var(--color-gray-50); border-radius: var(--radius-md); padding: 12px; }
.fact-value { font-size: 16px; font-weight: 700; color: var(--color-gray-900); }
.fact-label { font-size: 11px; color: var(--color-gray-500); margin-top: 2px; }
.section-title { font-size: 17px; font-weight: 700; color: var(--color-gray-900); margin: 24px 0 10px; }
.brief-row { display: flex; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--color-gray-100); }
.brief-row:last-child { border-bottom: none; }
.brief-q { flex: 0 0 112px; font-size: 13px; font-weight: 600; color: var(--color-gray-900); }
.brief-a { flex: 1; font-size: 13px; line-height: 1.55; color: var(--color-gray-600); }
.gallery { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-auto-rows: 96px; gap: 8px; }
.gallery-img { border-radius: var(--radius-md); background: var(--color-gray-100) center/cover no-repeat; }
.gallery-img:first-child { grid-row: span 2; }

/* Flights / Stay */
.opt-card { display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--color-gray-200); border-radius: var(--radius-lg); margin-bottom: 10px; }
.airline-tile { width: 40px; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--color-gray-200); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: var(--color-gray-700); flex-shrink: 0; }
.opt-body { flex: 1; min-width: 0; }
.opt-title { font-size: 15px; font-weight: 600; }
.opt-meta { font-size: 12px; color: var(--color-gray-500); margin-top: 2px; }
.opt-price { text-align: right; font-size: 17px; font-weight: 700; flex-shrink: 0; }
.opt-price span { display: block; font-size: 11px; font-weight: 500; color: var(--color-gray-400); }
.stay-photo { width: 84px; height: 72px; border-radius: var(--radius-md); background: var(--color-gray-200) center/cover no-repeat; flex-shrink: 0; }
.note { display: flex; gap: 10px; align-items: center; padding: 12px 14px; background: var(--color-gray-50); border-radius: var(--radius-md); font-size: 13px; color: var(--color-gray-600); margin-top: 6px; }
.note .zoya-mini { width: 22px; height: 22px; }

/* Finances */
.finance-summary { display: flex; gap: 10px; margin-bottom: 4px; }
.finance-stat { flex: 1; background: var(--color-gray-50); border-radius: var(--radius-md); padding: 14px; min-width: 0; }
.finance-stat-label { font-size: 12px; color: var(--color-gray-500); margin-bottom: 4px; }
.finance-stat-value { font-size: 20px; font-weight: 700; color: var(--color-gray-900); }
.finance-stat-value.positive { color: var(--color-success); }
.finance-stat-value.negative { color: var(--color-error); }
.seg-toggle { display: inline-flex; background: var(--color-gray-100); border-radius: var(--radius-full); padding: 3px; gap: 2px; }
.seg-btn { padding: 7px 14px; border: none; background: none; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; color: var(--color-gray-600); cursor: pointer; }
.seg-btn.active { background: var(--color-white); color: var(--color-gray-900); box-shadow: var(--shadow-xsmall); }
.est-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.est-total { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
.est-sub { font-size: 13px; color: var(--color-gray-500); }
.stack-bar { display: flex; height: 12px; border-radius: var(--radius-full); overflow: hidden; margin: 16px 0 12px; gap: 2px; }
.stack-bar div { height: 100%; transition: flex-grow 0.4s ease; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-gray-700); }
.legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.legend-amt { margin-left: auto; font-weight: 600; color: var(--color-gray-900); }
.finance-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--color-gray-100); }
.finance-row:last-child { border-bottom: none; }
.finance-row-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--color-gray-100); color: var(--color-gray-600); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.finance-row-body { flex: 1; min-width: 0; }
.finance-row-title { font-size: 13px; font-weight: 600; color: var(--color-gray-900); }
.finance-row-meta { font-size: 12px; color: var(--color-gray-500); margin-top: 2px; }
.finance-row-amount { font-size: 14px; font-weight: 700; color: var(--color-gray-900); flex-shrink: 0; }
.finance-row-amount.positive { color: var(--color-success); }
.finance-row-amount.negative { color: var(--color-error); }
.finance-row .friend-avatar { width: 32px; height: 32px; font-size: 12px; }

/* Avatars (Zenvoya DS) */
.avatar-stack { display: flex; align-items: center; }
.avatar-stack .stack-avatar, .avatar-stack .zoya-mini {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 2px solid var(--color-white);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: #fff;
  margin-left: -8px; flex-shrink: 0;
}
.avatar-stack .zoya-mini { border: none; box-shadow: 0 0 0 2px var(--color-white); }
.avatar-stack > :first-child { margin-left: 0; }
.friend-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; color: #fff; flex-shrink: 0; }
.avatar-tt { position: relative; }
.avatar-tt:hover { z-index: 20; }
.avatar-tooltip {
  position: absolute; bottom: 100%; left: 50%;
  transform: translate(-50%, 4px);
  background: var(--color-gray-900); color: var(--color-white);
  font-size: 11px; font-weight: 400;
  padding: 8px 10px; border-radius: var(--radius-sm);
  white-space: nowrap; opacity: 0; visibility: hidden;
  transition: opacity 0.15s, transform 0.15s;
  pointer-events: none; z-index: 30;
  text-align: left; line-height: 1.5; margin-bottom: 6px;
}
.avatar-tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--color-gray-900); }
.avatar-tt:hover .avatar-tooltip { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
.avatar-tooltip-name { font-weight: 600; }
.avatar-tooltip-meta { color: var(--color-gray-300); }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1100; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal-overlay.active { display: flex; }
.modal-box { background: var(--color-white); border-radius: var(--radius-lg); width: 440px; max-width: 100%; box-shadow: var(--shadow-xlarge); overflow: hidden; animation: popIn 0.2s ease; }
.modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--color-gray-200); }
.modal-header h3 { font-size: 16px; font-weight: 700; }
.modal-header p { font-size: 13px; color: var(--color-gray-500); margin-top: 3px; line-height: 1.4; }
.modal-body { padding: 14px 20px; max-height: min(520px, calc(100dvh - 200px)); overflow-y: auto; }
.modal-friend-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; cursor: pointer; width: 100%; border: none; background: none; text-align: left; }
.modal-friend-row .friend-avatar { width: 34px; height: 34px; font-size: 12px; }
.modal-friend-name { flex: 1; font-size: 14px; font-weight: 500; color: var(--color-gray-800); }
.modal-friend-name span { display: block; font-size: 12px; font-weight: 400; color: var(--color-gray-500); }
.modal-check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--color-gray-300); display: flex; align-items: center; justify-content: center; color: transparent; flex-shrink: 0; }
.modal-check.checked { background: var(--color-primary); border-color: var(--color-primary); color: white; }
.modal-share-row { display: flex; gap: 8px; margin-top: 6px; }
.modal-share-input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--color-gray-200); border-radius: var(--radius-full); font-size: 13px; font-family: var(--font-body); color: var(--color-gray-600); background: var(--color-gray-50); }
.toggle-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--color-gray-50); border-radius: var(--radius-md); margin-top: 14px; cursor: pointer; border: none; width: 100%; text-align: left; }
.toggle-row-text { flex: 1; font-size: 13px; color: var(--color-gray-600); line-height: 1.4; }
.toggle-row-text b { display: block; color: var(--color-gray-900); font-weight: 600; }
.switch { width: 36px; height: 22px; border-radius: 11px; background: var(--color-gray-300); position: relative; flex-shrink: 0; transition: background 0.15s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: white; transition: transform 0.15s; box-shadow: var(--shadow-xsmall); }
.switch.on { background: var(--color-primary); }
.switch.on::after { transform: translateX(14px); }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--color-gray-200); display: flex; gap: 8px; justify-content: flex-end; }

.toast {
  position: fixed; left: 50%; bottom: 28px;
  transform: translate(-50%, 20px);
  background: var(--color-gray-900); color: var(--color-white);
  padding: 10px 16px; border-radius: var(--radius-full);
  font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 8px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 1200;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Responsive */
@media (max-width: 1280px) {
  .trip-panel { min-width: 420px; }
}
@media (max-width: 900px) {
  .chatlist { display: none; }
  .rail { width: 60px; }
  .rail-item { width: 50px; font-size: 11px; }
  .trip-panel.open { position: fixed; inset: 0; z-index: 1000; padding: 0; background: var(--color-white); min-width: 0; width: auto; }
  .tp-card { border-radius: 0; border: none; box-shadow: none; flex-direction: column; }
  .tp-card.shared .tp-mswitch { display: flex; align-self: center; margin: 10px 0; flex-shrink: 0; }
  .tp-card.shared .tp-group { display: none; flex: 1; border-right: none; min-height: 0; }
  .tp-card.shared.show-group .tp-group { display: flex; }
  .tp-card.shared.show-group .tp-plan { display: none; }
  .tp-card.shared:not(.show-group) .plan-btn, .tp-card.shared.show-group .group-btn { background: var(--color-white); color: var(--color-gray-900); box-shadow: var(--shadow-xsmall); }
  .chat-header { padding-left: 16px; padding-right: 16px; }

  .facts { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) {
  .dest-wrap { grid-template-columns: 1fr; }
  .tp-head { flex-direction: column; }
  .tp-thumb { width: 72px; height: 72px; }
  .audience-btn .audience-label { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; }
}
</style>

<body>
<div id="app">
  <!-- Icon rail -->
  <nav class="rail" aria-label="Main">
    <div class="rail-logo" title="Zenvoya">Z</div>
    <button class="rail-item active" id="railChat"><span class="rail-icon" data-icon="message-square"></span>Chat</button>
    <button class="rail-item" onclick="toast('Shop isn\'t part of this prototype')"><span class="rail-icon" data-icon="shopping-cart"></span>Shop</button>
    <button class="rail-item" onclick="toast('Trips isn\'t part of this prototype')"><span class="rail-icon" data-icon="bookmark"></span>Trips</button>
    <div class="rail-spacer"></div>
    <div class="user-avatar avatar-tt" id="railUser">G</div>
  </nav>

  <!-- Chat list -->
  <aside class="chatlist" id="chatList">
    <div class="chatlist-inner">
      <div class="chatlist-top">
        <button class="new-chat-btn" onclick="newPersonalChat()"><span data-icon="plus"></span> New chat</button>
        <button class="icon-btn" onclick="toggleChatList()" title="Hide chat list" data-icon="panel-left"></button>
      </div>
      <div class="chatlist-items" id="chatListItems"></div>
    </div>
  </aside>

  <!-- Chat column -->
  <main class="chat-col">
    <header class="chat-header">
      <button class="icon-btn" id="showListBtn" onclick="toggleChatList()" title="Show chat list" data-icon="panel-left" style="display:none;"></button>
      <div class="chat-header-main">
        <div class="chat-title" id="chatTitle"></div>
        <div class="chat-sub" id="chatSub"></div>
      </div>
      <button class="icon-btn" onclick="openShareModal()" title="Share trip plan" data-icon="share-up"></button>
      <button class="icon-btn" onclick="deleteActiveChat()" title="Delete chat" data-icon="trash-2"></button>
    </header>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="composer-area" id="composerArea"></div>

function slugifyLocation(str) {
  return (str || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function locImgFor(label) {
  const slug = slugifyLocation(label);
  return LOCATION_IMAGES.has(slug) ? `images/locations/${slug}.jpg` : null;
}
function bgUrl(src) { return `url('${src}') center/cover no-repeat`; }

  const img = locImgFor(a.loc || a.title);
  return img ? bgUrl(img) : bgUrl(plan.img);
}

/* ===================== DATES / MONEY ===================== */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtDay(d) { return `${WD[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; }
function fmtRange(start, n) {
  const end = addDays(start, n - 1);
  return start.getMonth() === end.getMonth()
    ? `${MON[start.getMonth()]} ${start.getDate()} – ${end.getDate()}`
    : `${MON[start.getMonth()]} ${start.getDate()} – ${MON[end.getMonth()]} ${end.getDate()}`;
}
function money(n) { return '$' + Math.round(n).toLocaleString(); }

/* ===================== PLANS ===================== */
const PLANS = {};
let activePlanId = null;
function plan() { return PLANS[activePlanId]; }

function buildPlan(id) {
  const t = TEMPLATES[id];
  const opt = DEST_OPTIONS.find(o => o.id === id);
  const p = {
    id, ...t, title: t.name + ' getaway', start: opt.start,
    tier: 'average', members: [ME], shared: false, saved: false,
    tab: 'itinerary', open: new Set([1]), adding: null, expenses: [],
    days: [
      { kind: 'depart', acts: [{ title: `Flight JFK → ${t.code}`, desc: `Overnight, lands at ${t.airport} the next morning.`, time: 'Evening', by: 'zoya', flight: true }] },
      ...t.days.map(d => ({ kind: 'city', acts: d.map(a => ({ ...a, by: 'zoya' })) })),
      { kind: 'return', acts: [{ title: `Flight ${t.code} → JFK`, desc: 'Midday departure, home by the evening.', time: 'Morning', by: 'zoya', flight: true }] },
    ],
  };
  return p;
}
function ensurePlan(id) { if (!PLANS[id]) PLANS[id] = buildPlan(id); return PLANS[id]; }
function planRange(p) { return fmtRange(p.start, p.days.length); }

const TIER = { budget: 0.72, average: 1, premium: 1.65 };
function estimate(p, tier) {
  const f = TIER[tier || p.tier];
  const n = p.days.length, nights = n - 1, share = p.members.length > 1 ? 2 : 1;
  const parts = {
    Flights: p.cost.flight * f,
    Stay: p.cost.stay * f * nights / share,
    Food: p.cost.food * f * n,
    Activities: p.cost.acts * f * (n - 1),
  };
  parts.total = parts.Flights + parts.Stay + parts.Food + parts.Activities;
  return parts;
}
function optionEstimate(id) { return estimate({ ...TEMPLATES[id], days: [1, 2, 3, 4], members: [ME], tier: 'average' }).total; }

let chatOrder = [];
let activeChatId = null;
let chatSeq = 1;

function addChat(c) {

}
function active() { return CHATS[activeChatId]; }

/* ===================== MESSAGE RENDERING ===================== */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function richText(s) { return esc(s).replace(/@zoya/gi, '<span class="mention">@Zoya</span>'); }

function senderKey(m) { return m.type ? null : (m.role === 'friend' ? m.person.id : m.role); }

function messageHTML(m, i, chat) {
  const prev = chat.messages[i - 1];
  const grouped = prev && senderKey(prev) && senderKey(prev) === senderKey(m) && !m.type;
  const isNew = m._new ? ' is-new' : '';
  const isGroup = chat.kind === 'group';
  if (m.type === 'dests') return destOptionsHTML(m, i, isNew, chat);
  if (m.role === 'system') {
    return `<div class="sys-line${isNew}">${lucide(m.icon || 'pencil', 13)}<span>${m.html}</span>${m.view ? `<button class="sys-link" onclick="viewInPlan('${m.view.plan}', ${m.view.day})">View</button>` : ''}</div>`;
  }
  if (m.role === 'me') {
    const meta = isGroup ? `<div class="message-meta">${m.toZoya ? `${ZOYA_MINI} Sent to group + Zoya` : 'Sent to group'}</div>` : '';
    const attach = m.attach ? attachHTML(m.attach) : '';
    return `<div class="message me${isNew}"><div class="message-col">${attach}${m.text ? `<div class="message-bubble">${richText(m.text)}</div>` : ''}${meta}</div></div>`;
  }
  if (m.role === 'friend') {
    return `<div class="message friend${grouped ? ' grouped' : ''}${isNew}">
      <div class="message-avatar">${friendAvatarHTML(m.person)}</div>
      <div class="message-col">
        ${grouped ? '' : `<div class="message-name">${m.person.name.split(' ')[0]}</div>`}
        <div class="message-bubble">${richText(m.text)}</div>
        ${m.toZoya ? `<div class="message-meta">${ZOYA_MINI} Sent to group + Zoya</div>` : ''}
      </div>
    </div>`;
  }
  // Zoya
  const wide = m.attach && (m.attach.type === 'draft' || m.attach.type === 'trip');
  return `<div class="message bot${grouped ? ' grouped' : ''}${isNew}">
    <div class="message-avatar">${ZOYA_SVG}</div>
    <div class="message-col${wide ? ' wide' : ''}">
      ${isGroup && !grouped ? `<div class="message-name">Zoya</div>` : ''}
      ${m.text ? `<div class="message-bubble">${m.text}</div>` : ''}
      ${m.attach ? attachHTML(m.attach) : ''}
      ${m.chips ? `<div class="chips">${m.chips.map((c, ci) => `<button class="chip" ${m.chipsUsed ? 'disabled' : ''} onclick="chipClick('${chat.id}', ${i}, ${ci})">${c.label}</button>`).join('')}</div>` : ''}
    </div>
  </div>`;
}

function destOptionsHTML(m, i, isNew, chat) {
  return `<div class="dest-wrap${isNew}">${DEST_OPTIONS.map(o => {
    const t = TEMPLATES[o.id];
    const sel = m.selected === o.id;
    return `<button class="dest-card${sel ? ' selected' : ''}" onclick="pickDestination('${o.id}', '${chat.id}', ${i})" aria-pressed="${sel}">
      <div class="dest-photo" style="background-image:url('${t.img}')"><span class="dest-price">≈ ${money(optionEstimate(o.id))} pp</span></div>
      <div class="dest-info">
        <div class="dest-info-text">
          <div class="dest-name">${t.name}</div>
          <div class="dest-country">${t.country}</div>
          <div class="dest-dates">${lucide('calendar', 13)} ${fmtRange(o.start, 4)}</div>
        </div>
        <span class="dest-arrow">${lucide('arrow-right', 20)}</span>
      </div>
    </button>`;
  }).join('')}</div>`;
}

const DRAFT_STEPS = ['Picking dates and flights', 'Laying out each day', 'Estimating the budget'];
function attachHTML(a) {
  if (a.type === 'draft') {
    const p = PLANS[a.plan];
    if (a.step >= DRAFT_STEPS.length) return tripCardHTML(p);
    return `<div class="draft-card">
      <div class="draft-title">Drafting your ${p.name} trip plan</div>
      ${DRAFT_STEPS.map((s, si) => `<div class="draft-step ${si < a.step ? 'done' : si === a.step ? 'current' : ''}"><span class="draft-step-icon">${si < a.step ? lucide('check', 11) : ''}</span>${s}</div>`).join('')}
    </div>`;
  }
  if (a.type === 'trip') return tripCardHTML(PLANS[a.plan]);
  if (a.type === 'update') {
    const p = PLANS[a.plan];
    return `<div class="update-card">
      <div class="update-card-thumb" style="background:${a.act ? actBg(p, a.act) : bgUrl(p.img)}"></div>
      <div class="update-card-body"><div class="update-card-title">${a.title}</div><div class="update-card-meta">${a.meta}</div></div>
      <button class="btn" onclick="viewInPlan('${p.id}', ${a.day == null ? 'null' : a.day}, '${a.tab || 'itinerary'}')">View</button>
    </div>`;
  }
  return '';
}

function tripCardHTML(p) {
  return `<div class="trip-card" onclick="openPanel('${p.id}')" role="button" tabindex="0">
    <div class="trip-card-thumb" style="background-image:url('${p.img}')"></div>
    <div class="trip-card-body">
      <div class="trip-card-name">${esc(p.title)}</div>
      <div class="trip-card-meta">${planRange(p)}, ${p.days.length} days · ${money(estimate(p).total)} per person</div>
      <div class="trip-card-tags">
        ${p.shared ? `<span class="tag dark">${lucide('users', 11)} Shared</span><div class="avatar-stack">${p.members.map(stackAvatarHTML).join('')}</div>` : `<span class="tag">${lucide('lock', 11)} Draft, only you</span>`}
      </div>
    </div>
    <span class="btn">Open plan</span>
  </div>`;
}

// Two places show a thread: the main column (your private chat with Zoya) and,
// for a shared plan, the group-chat column inside the trip panel.
function shownGroupId() {
  const p = plan();
  return p && p.shared && groupVisible(p) && document.getElementById('tripPanel').classList.contains('open') ? 'g-' + p.id : null;
}
function isMobile() { return window.innerWidth <= 900; }
// On mobile the group chat is one side of the Plan / Group chat switch, so it's never "collapsed".
function groupVisible(p) { return p.groupOpen !== false || isMobile(); }
function viewFor(chatId) {
  if (chatId === activeChatId) return { msgs: 'chatMessages', area: 'composerArea' };
  if (chatId === shownGroupId()) return { msgs: 'groupMessages', area: 'groupComposer' };
  return null;
}
function renderThread(chatId) {
  const v = viewFor(chatId);
  const chat = CHATS[chatId];
  if (!v || !chat) return;
  const el = document.getElementById(v.msgs);
  let html = chat.messages.map((m, i) => messageHTML(m, i, chat)).join('');
  if (chat.typing) {
    const who = chat.typing;
    html += `<div class="typing">${who === 'zoya' ? `<div class="message-avatar">${ZOYA_SVG}</div>` : `<div class="message-avatar">${friendAvatarHTML(who, 'width:28px;height:28px;font-size:11px;')}</div>`}<span class="typing-dots"><span></span><span></span><span></span></span>${who === 'zoya' ? 'Zoya is' : firstName(who) + ' is'} typing</div>`;
  }
  el.innerHTML = html;
  chat.messages.forEach(m => { delete m._new; });
  requestAnimationFrame(() => el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' }));
}
function renderMessages() { renderThread(activeChatId); }
function rerenderChatIfShowing() { renderThread(activeChatId); const g = shownGroupId(); if (g) renderThread(g); }

function push(chatId, m) {
  const chat = CHATS[chatId];
  if (!chat) return;
  m._new = true;
  chat.messages.push(m);
  if (viewFor(chatId)) renderThread(chatId);
  else { chat.unread++; if (chat.kind === 'group') renderBadge(); }
  // most recent first in the list (a group thread counts toward its trip's chat)
  const r = chat.personalId || chatId;
  chatOrder = [r, ...chatOrder.filter(id => id !== r)];
  renderChatList();
}
function setTyping(chatId, who) {
  const chat = CHATS[chatId];
  if (!chat) return;
  chat.typing = who;
  renderThread(chatId);
}
function later(ms, fn) { return setTimeout(fn, ms); }

/* ===================== HEADER + CHAT LIST ===================== */
function renderHeader() {
  const c = active();
  document.getElementById('chatTitle').textContent = c.title;
  const g = c.groupId && CHATS[c.groupId];
  document.getElementById('chatSub').innerHTML = g
    ? `${lucide('lock', 12)} Private with Zoya · <button class="sys-link" onclick="openGroupChat('${c.planId}')">Group chat</button>`
    : `${lucide('lock', 12)} Private — only you and Zoya can see this`;
}

function renderChatList() {
  const roots = chatOrder.filter(id => CHATS[id].kind !== 'group');
  const shared = roots.filter(id => CHATS[id].groupId);
  const solo = roots.filter(id => !CHATS[id].groupId);
  const item = id => {
    const c = CHATS[id];
    const g = c.groupId && CHATS[c.groupId];
    const unread = (id !== activeChatId && c.unread) || (g && g.unread);
    return `<button class="chatlist-item${id === activeChatId ? ' active' : ''}" onclick="selectChat('${id}')">
      ${g ? `<span class="chatlist-item-icon avatar-stack chatlist-avatars">${g.members.slice(0, 3).map(stackAvatarHTML).join('')}</span>` : ''}
      <span class="chatlist-item-name">${esc(c.title)}</span>
      ${unread ? '<span class="unread-dot"></span>' : ''}
    </button>`;
  };
  document.getElementById('chatListItems').innerHTML =
    (shared.length ? `<div class="chatlist-label">Group trips</div>${shared.map(item).join('')}<div class="chatlist-label">Your chats</div>` : '') +
    solo.map(item).join('');
}

function renderComposer(chatId) {
  const c = CHATS[chatId];
  const v = viewFor(chatId);
  if (!c || !v) return;
  const inputId = 'input-' + chatId;
  let html;
  if (c.kind === 'group') {
    const withZoya = c.audience === 'zoya';
    const others = c.members.filter(m => m !== ME);
    html = `<div class="composer has-audience">
      <button class="audience-btn${withZoya ? ' with-zoya' : ''}" onclick="toggleAudienceMenu(event, '${chatId}')" aria-haspopup="menu" title="Choose who gets this message">
        ${withZoya ? ZOYA_MINI : lucide('users', 15)}
        <span class="audience-label">${withZoya ? 'Group + Zoya' : 'Group'}</span>${lucide('chevron-down', 14)}
      </button>
      <input class="composer-input" id="${inputId}" placeholder="${withZoya ? 'Message everyone…' : 'Message the group…'}" autocomplete="off">
      <button class="send-btn" onclick="send('${chatId}')" title="Send">${lucide('arrow-up', 20)}</button>
      <div class="tab-menu audience-menu" id="audience-${chatId}" role="menu">
        <button class="menu-item${withZoya ? ' selected' : ''}" onclick="setAudience('${chatId}', 'zoya')">
          <span class="menu-item-icon">${ZOYA_SVG}</span>
          <span><div class="menu-item-title">Group + Zoya</div><div class="menu-item-desc">Zoya replies to everyone and can edit the trip plan.</div></span>
          <span class="menu-item-check">${lucide('check', 16)}</span>
        </button>
        <button class="menu-item${!withZoya ? ' selected' : ''}" onclick="setAudience('${chatId}', 'group')">
          <span class="menu-item-icon">${lucide('users', 15)}</span>
          <span><div class="menu-item-title">Group only</div><div class="menu-item-desc">Only ${namesList(others)} see it. Zoya stays quiet.</div></span>
          <span class="menu-item-check">${lucide('check', 16)}</span>
        </button>
      </div>
    </div>
    <div class="composer-hint">${withZoya ? 'Zoya will reply to everyone.' : 'Type <b>@Zoya</b> to include Zoya for one message.'}</div>`;
  } else {
    const ph = c.groupId ? 'Ask Zoya privately — the group won\'t see this' : 'Ask anything travel';
    html = `<div class="composer">
      <input class="composer-input" id="${inputId}" placeholder="${ph}" autocomplete="off">
      <button class="icon-btn" title="Voice input" onclick="toast('Voice input isn\\'t part of this prototype')">${lucide('mic', 18)}</button>
      <button class="send-btn" onclick="send('${chatId}')" title="Send">${lucide('arrow-up', 20)}</button>
    </div>`;
  }
  document.getElementById(v.area).innerHTML = html;
  const input = document.getElementById(inputId);
  input.value = c.draft || '';
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(chatId); });
  input.addEventListener('input', () => { c.draft = input.value; });
}

function renderChat() {
  renderHeader();
  renderChatList();
  renderMessages();
  renderComposer(activeChatId);
}

// Selecting a chat shows its trip plan alongside it; a shared plan brings its group chat.
function selectChat(id) {
  activeChatId = id;
  CHATS[id].unread = 0;
  closeMenus();
  renderChat();
  const c = CHATS[id];
  if (c.planId) openPanel(c.planId); else closePanel();
}

function newPersonalChat() {
  const id = 'c-new-' + (chatSeq++);
  addChat({ id, kind: 'personal', title: 'New chat', fresh: true, messages: [{ role: 'zoya', text: GREETING }] });
  selectChat(id);
  document.getElementById('input-' + id).focus();
}

function toggleAudienceMenu(e, chatId) {
  e.stopPropagation();
  const m = document.getElementById('audience-' + chatId);
  const wasOpen = m.classList.contains('open');
  closeMenus();
  if (!wasOpen) m.classList.add('open');
}
function setAudience(chatId, a) {
  CHATS[chatId].audience = a;
  renderComposer(chatId);
  document.getElementById('input-' + chatId).focus();
}
function closeMenus() { document.querySelectorAll('.tab-menu.open').forEach(m => m.classList.remove('open')); }
document.addEventListener('click', e => { if (!e.target.closest('.tab-menu')) closeMenus(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); closeShareModal(); } });

function toggleChatList() {
  const list = document.getElementById('chatList');
  list.classList.toggle('collapsed');
  document.getElementById('showListBtn').style.display = list.classList.contains('collapsed') ? '' : 'none';
}
function deleteActiveChat() {
  const c = active();
  if (c.id === 'c-main') { toast('This chat started your trip plan, so it stays'); return; }
  if (!confirm(`Delete "${c.title}"?`)) return;
  [c.id, c.groupId].filter(Boolean).forEach(id => { delete CHATS[id]; });
  chatOrder = chatOrder.filter(id => CHATS[id]);
  selectChat(chatOrder.find(id => CHATS[id].kind !== 'group'));
}

/* ===================== DESTINATION → TRIP PLAN SHELL ===================== */
function pickDestination(id, chatId, msgIndex) {
  const chat = CHATS[chatId];
  const m = chat.messages[msgIndex];
  const firstTime = !PLANS[id];
  m.selected = id;
  const p = ensurePlan(id);
  if (firstTime) p.chatId = chat.id;
  if (!chat.groupId) chat.planId = id;
  if (chat.id === 'c-main' && !chat.groupId) chat.title = `New York > ${p.name}`;
  renderHeader(); renderChatList();
  renderThread(chat.id);
  if (!firstTime) { openPanel(id); return; }

  push(chat.id, { role: 'me', text: `Let's do ${p.name}, ${planRange(p)}` });
  later(500, () => {
    const draft = { role: 'zoya', text: `Great pick. I'm putting together a trip plan for ${p.name} you can edit and share.`, attach: { type: 'draft', plan: id, step: 0 } };
    push(chat.id, draft);
    later(500, () => openPanel(id, true));
    [1, 2, 3].forEach(s => later(500 + s * 650, () => {
      draft.attach.step = s;
      renderThread(chat.id);
    }));
    later(500 + 4 * 650, () => push(chat.id, {
      role: 'zoya',
      text: `Your ${p.name} plan is ready on the right. Change anything — days, activities, budget — and hit <b>Share</b> when you want friends to plan it with you.`,
      chips: [{ label: 'Share with friends', action: 'share' }, { label: 'Make it cheaper', send: 'Make it cheaper' }, { label: 'Add a food experience', send: 'Add a food experience' }],
    }));
  });
}

function openPanel(id, drafting) {
  activePlanId = id;
  const p = PLANS[id];
  const panel = document.getElementById('tripPanel');
  const card = document.getElementById('tpCard');
  panel.classList.add('open');
  card.classList.toggle('drafting', !!drafting);
  if (drafting) later(1800, () => card.classList.remove('drafting'));
  applyPanelLayout();
  document.getElementById('tpPlan').scrollTop = 0;
  renderPanel();
  renderGroupPane();
  initMap();
}
function closePanel() { document.getElementById('tripPanel').classList.remove('open'); }

function applyPanelLayout() {
  const p = plan();
  const panel = document.getElementById('tripPanel');
  const card = document.getElementById('tpCard');
  const groupOpen = p.shared && p.groupOpen !== false && !isMobile();
  card.classList.toggle('shared', p.shared);
  card.classList.toggle('group-open', groupOpen);
  panel.classList.toggle('wide', groupOpen);
  // Make room by hiding the chat history list: always for three columns, on smaller screens otherwise.
  if (!isMobile() && (groupOpen || window.innerWidth < 1500)) {
    const list = document.getElementById('chatList');
    if (!list.classList.contains('collapsed')) toggleChatList();
  }
  if (map) setTimeout(() => map.resize(), 0);
}
function setGroupOpen(open) {
  const p = plan();
  p.groupOpen = open;
  applyPanelLayout();
  renderBadge();
  if (open) renderGroupPane();
}
function openGroupChat(planId) {
  PLANS[planId].groupOpen = true;
  openPanel(planId);
}

function renderGroupPane() {
  const p = plan();
  const g = p && p.shared && groupChatFor(p);
  if (!g) return;
  g.unread = 0;
  document.getElementById('tpGroupHead').innerHTML = `

function viewInPlan(id, day, tab) {

          </span>

function renderBadge() {
  const p = plan();
  const badge = document.getElementById('tpBadge');
  if (!p || !badge) return;
  const g = p.shared && groupChatFor(p);
  const hidden = g && !groupVisible(p);
  badge.classList.toggle('as-btn', !!hidden);
  badge.onclick = hidden ? () => setGroupOpen(true) : null;
  badge.onkeydown = hidden ? e => { if (e.key === 'Enter') setGroupOpen(true); } : null;
  if (hidden) { badge.setAttribute('role', 'button'); badge.tabIndex = 0; badge.title = 'Show group chat'; }
  else { badge.removeAttribute('role'); badge.removeAttribute('tabindex'); badge.removeAttribute('title'); }
  badge.innerHTML = hidden
    ? `${lucide('message-square', 14)} Group chat <span class="avatar-stack">${g.members.map(stackAvatarHTML).join('')}</span>${g.unread ? `<span class="tp-float-count">${g.unread}</span>` : ''}`

function setTab(t) { plan().tab = t; renderPanel(); }
function renameTrip(el) {

function toggleSave() { const p = plan(); p.saved = !p.saved; renderPanel(); toast(p.saved ? 'Saved to Trips' : 'Removed from Trips'); }
function toggleDaysMenu(e) {

function addPanelHTML(p, i) {
  if (p.adding !== i) return `<button class="add-act-btn" onclick="p_startAdding(${i})">${lucide('plus', 14)} Add to this day</button>`;

/* ---- Edits (shared plans log every edit to the group chat) ---- */
function addAct(p, di, act, by) {
  const a = { ...act, by, _fresh: true };
  p.days[di].acts.push(a);
  p.open.add(di);
  return a;
}
function addSuggestion(di, si, mine) {
  const p = plan();
  const a = addAct(p, di, p.suggest[si], ME);
  p.adding = null;
  renderPanel(); updatePins();
  logEdit(p, `<b>You</b> added <b>${esc(a.title)}</b> to Day ${di + 1}`, di, 'plus');
}
function addCustom(di) {
  const p = plan();
  const v = (document.getElementById('addInput').value || '').trim();
  if (!v) return;
  const a = addAct(p, di, { title: v, desc: 'Added by you — Zoya will find times and tickets.', time: 'Afternoon' }, ME);
  p.adding = null;
  renderPanel();
  logEdit(p, `<b>You</b> added <b>${esc(a.title)}</b> to Day ${di + 1}`, di, 'plus');
}
function removeAct(di, ai) {
  const p = plan();
  const [a] = p.days[di].acts.splice(ai, 1);
  renderPanel(); updatePins();
  logEdit(p, `<b>You</b> removed <b>${esc(a.title)}</b> from Day ${di + 1}`, di, 'trash-2');
}
function setDays(n) {
  const p = plan();
  closeMenus();
  if (n === p.days.length) return;
  const cities = p.days.filter(d => d.kind === 'city');
  const want = n - 2;
  while (cities.length < want) cities.push({ kind: 'city', acts: [] });
  cities.length = want;
  p.days = [p.days[0], ...cities, p.days[p.days.length - 1]];
  p.open = new Set([...p.open].filter(i => i < n));
  renderPanel(); updatePins();
  logEdit(p, `<b>You</b> changed the trip to <b>${n} days</b> (${planRange(p)})`, null, 'calendar');
  rerenderChatIfShowing();
}
function setTier(t, quiet) {
  const p = plan();
  if (p.tier === t) return;
  p.tier = t;
  renderPanel();
  if (!quiet) logEdit(p, `<b>You</b> switched to <b>${t}</b> picks, now ${money(estimate(p).total)} per person`, null, 'dollar-sign', 'finances');
  rerenderChatIfShowing();
}
function logEdit(p, html, day, icon, tab) {
  const g = groupChatFor(p);
  if (!g) return;
  push(g.id, { role: 'system', html, icon, view: day != null ? { plan: p.id, day } : null });
}
function rerenderChatIfShowing() { renderMessages(); }

/* ===================== MAP ===================== */
// OpenFreeMap vector street map via MapLibre: no API key, unlike Google Maps,
// and not rate-blocked like OSM's own tile servers.
const MAP_STYLE = 'https://tiles.openfreemap.org/styles/liberty';
let map = null, mapMarkers = [], mapPlanId = null;
function planPoints(p) { return p.days.flatMap((d, di) => d.acts.filter(a => a.ll).map(a => ({ a, di }))); }
function initMap() {
  const p = plan();
  if (typeof maplibregl === 'undefined') return;
  if (!map) {
    const first = planPoints(p)[0];
    map = new maplibregl.Map({
      container: 'tpMap', style: MAP_STYLE,
      center: first ? [first.a.ll[1], first.a.ll[0]] : [0, 30], zoom: 12,
      attributionControl: { compact: true },
    });
    map.scrollZoom.disable();
    // Start with the credits collapsed to the (i) button so they don't cover the pins.
    map.on('load', () => { const a = document.querySelector('#tpMap .maplibregl-ctrl-attrib'); if (a) a.classList.remove('maplibregl-compact-show'); });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-left');
  }
  setTimeout(() => { map.resize(); updatePins(mapPlanId !== p.id); mapPlanId = p.id; }, 30);
}
function updatePins(fit) {
  const p = plan();
  if (!map || !p) return;
  mapMarkers.forEach(m => m.remove());
  const pts = planPoints(p);
  mapMarkers = pts.map(({ a, di }) => {
    const el = document.createElement('div');
    el.className = 'map-pin';
    el.innerHTML = `<div class="map-pin-marker"><div class="map-pin-dot"><span>${di + 1}</span></div><div class="map-pin-label">${esc(a.title)}</div></div>`;
    el.addEventListener('click', () => viewInPlan(p.id, di));
    return new maplibregl.Marker({ element: el, anchor: 'top', offset: [0, -32] }).setLngLat([a.ll[1], a.ll[0]]).addTo(map);
  });
  if (fit !== false && pts.length) {
    const b = new maplibregl.LngLatBounds();
    pts.forEach(({ a }) => b.extend([a.ll[1], a.ll[0]]));
    map.fitBounds(b, { padding: { top: 60, bottom: 50, left: 60, right: 60 }, maxZoom: 14.5, duration: mapPlanId ? 600 : 0 });
  }
}
window.addEventListener('resize', () => { if (map) map.resize(); });

/* ===================== SHARING → GROUP CHAT ===================== */

function closeShareModal() { document.getElementById('shareOverlay').classList.remove('active'); }
function toggleShareFriend(id) { shareSel.has(id) ? shareSel.delete(id) : shareSel.add(id); renderShareModal(); }

  document.getElementById('shareBox').innerHTML = `

    </div>

          <span class="modal-friend-name">${f.name}<span>${isMember ? 'Already planning' : levelLabel(f.level)}</span></span>
          <span class="modal-check${on ? ' checked' : ''}">${lucide('check', 12)}</span>
        </button>`;
      }).join('')}
      <div class="modal-share-row" style="margin-top:12px;">
        <input class="modal-share-input" value="zenvoya.app/t/${p.id}-dec" readonly aria-label="Share link">
        <button class="btn" onclick="toast('Link copied')">${lucide('link', 14)} Copy link</button>
      </div>
      ${p.shared ? '' : `<div class="toggle-row" style="cursor:default;">
        <span class="share-banner-icon">${lucide('users', 15)}</span>
        <span class="toggle-row-text"><b>This chat becomes a group trip</b>It gets two tabs: a group chat where everyone can plan with Zoya, and your private chat with Zoya.</span>
      </div>`}
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeShareModal()">Cancel</button>
      <button class="btn primary" ${count ? '' : 'disabled style="opacity:.4;cursor:default;"'} onclick="confirmShare()">${lucide('share-up', 14)} ${p.shared ? `Add ${count} ${count === 1 ? 'person' : 'people'}` : `Share with ${count} ${count === 1 ? 'person' : 'people'}`}</button>
    </div>`;
}

function confirmShare() {
  const p = plan();
  const already = new Set(p.members.map(m => m.id));
  const added = [...shareSel].filter(id => !already.has(id)).map(friendById);
  if (!added.length) return;
  closeShareModal();
  const wasShared = p.shared;
  p.members = [...p.members, ...added];
  p.shared = true;
  if (!wasShared) {
    p.expenses = [
      { title: `${p.stays[0][0]} deposit`, amount: Math.round(p.stays[0][3] * 2), payer: added[0], icon: 'bed' },
      { title: `${p.days[1].acts[0] ? p.days[1].acts[0].title : 'Tickets'} tickets`, amount: 28 * p.members.length, payer: ME, icon: 'ticket' },
    ];
  }
  let root = CHATS[p.chatId] || CHATS['c-main'];
  if (!wasShared && root.groupId) {
    // That chat already hosts another group trip, so this plan gets its own conversation.
    root = addChat({ id: 'c-' + p.id, kind: 'personal', title: p.title, messages: [{ role: 'zoya', text: `This is your private side of the ${p.name} plan. Ask me anything here — the group won't see it.` }] });
    p.chatId = root.id;
  }
  const g = groupChatFor(p) || addChat({ id: 'g-' + p.id, kind: 'group', title: p.title, members: p.members, audience: 'zoya', personalId: root.id, messages: [] });
  g.members = p.members;
  root.groupId = g.id;
  root.planId = p.id;
  root.title = p.title;
  toast(`Shared with ${namesList(added)}`);

  if (!wasShared) {
    g.messages.push({ role: 'system', icon: 'users', html: `<b>You</b> started the group with ${namesList(added)}` });
    g.messages.push({ role: 'me', text: `Made us a plan for ${p.name}, ${planRange(p)}. Edit anything!`, attach: { type: 'trip', plan: p.id } });
    if (activeChatId !== root.id) selectChat(root.id);
    p.groupOpen = true;
    openPanel(p.id);
    renderHeader();
    renderComposer(root.id);
    push(root.id, { role: 'zoya', text: `Shared with ${namesList(added)}. Your group chat now lives inside the trip plan, next to the itinerary. This chat stays private between you and me.` });
    runGroupScript(p, g);
  } else {
    renderPanel();
    renderGroupPane();
    push(g.id, { role: 'system', icon: 'user-plus', html: `<b>You</b> added ${namesList(added)}` });
  }
}

// Simulated friends reacting once a plan is shared.
function runGroupScript(p, g) {
  const [a, b, c] = g.members.filter(m => m !== ME);
  const lastCity = p.days.length - 2;
  const rainy = p.suggest.findIndex(s => s.indoor);
  let t = 1200;
  const step = (gap, fn) => { t += gap; later(t, fn); };
  if (a) {
    step(0, () => setTyping(g.id, a));
    step(1300, () => { setTyping(g.id, null); push(g.id, { role: 'friend', person: a, text: `${p.name} in December?? I'm in 🙌` }); });
  }
  if (b) {
    step(900, () => setTyping(g.id, b));
    step(1500, () => { setTyping(g.id, null); push(g.id, { role: 'friend', person: b, text: `Same! I'll add a sunset spot for our last night.` }); });
    step(1400, () => {
      const s = p.suggest[0];
      if (!p.days[lastCity].acts.some(x => x.title === s.title)) {
        addAct(p, lastCity, s, b);
        if (activePlanId === p.id) { renderPanel(); updatePins(false); }
        push(g.id, { role: 'system', icon: 'plus', html: `<b>${firstName(b)}</b> added <b>${esc(s.title)}</b> to Day ${lastCity + 1}`, view: { plan: p.id, day: lastCity } });
      }
    });
  }
  if (c && rainy > -1) {
    step(1600, () => setTyping(g.id, c));
    step(1500, () => { setTyping(g.id, null); push(g.id, { role: 'friend', person: c, toZoya: true, text: `@Zoya what do we do if it rains?` }); });
    step(700, () => setTyping(g.id, 'zoya'));
    step(1500, () => {
      setTyping(g.id, null);
      const s = p.suggest[rainy];
      push(g.id, {
        role: 'zoya',
        text: `Good question, ${firstName(c)}. December can be wet in ${p.name}. <b>${s.title}</b> is a great indoor backup. ${s.desc} Want me to add it to Day 2 as a rainy-day option?`,
        chips: [{ label: 'Add it to Day 2', action: 'add', plan: p.id, day: 1, idx: rainy }, { label: 'Not now', action: 'dismiss' }],
      });
    });
  }
}

/* ===================== SENDING + ZOYA ===================== */
const GROUP_REPLIES = ['Love that 👍', 'Works for me', 'Agreed, let\'s do it', 'Ha, yes', 'I can book that if nobody else does'];
let replySeq = 0;

function send(chatId, textArg) {
  const c = CHATS[chatId];
  const input = document.getElementById('input-' + chatId);
  const text = (textArg != null ? textArg : input.value).trim();
  if (!text) return;
  if (textArg == null) { input.value = ''; c.draft = ''; }
  if (c.kind === 'group') {
    const toZoya = c.audience === 'zoya' || /@zoya/i.test(text);
    push(c.id, { role: 'me', text, toZoya });
    if (toZoya) zoyaRespond(c, text);
    else {
      const others = c.members.filter(m => m !== ME);
      const who = others[replySeq % others.length];
      const reply = GROUP_REPLIES[replySeq++ % GROUP_REPLIES.length];
      later(700, () => setTyping(c.id, who));
      later(2000, () => { setTyping(c.id, null); push(c.id, { role: 'friend', person: who, text: reply }); });
    }
  } else {
    if (c.fresh) { c.title = text.length > 32 ? text.slice(0, 30) + '…' : text; c.fresh = false; renderHeader(); renderChatList(); }
    push(c.id, { role: 'me', text });
    zoyaRespond(c, text);
  }
}

function zoyaRespond(c, text) {
  const t = text.toLowerCase();
  const p = plan();
  later(500, () => setTyping(c.id, 'zoya'));
  later(1600, () => {
    setTyping(c.id, null);
    const wantsIdeas = /trip|where|somewhere|idea|destination|europe|go to|vacation|holiday|getaway/.test(t) && !/cheap|budget|food|day/.test(t);
    if (!p || (c.kind === 'personal' && wantsIdeas)) {
      push(c.id, { role: 'zoya', text: 'Here are some ideas that you might like, each with dates that work in early December.' });
      later(350, () => push(c.id, { type: 'dests', selected: null }));
      return;
    }
    if (/cheap|budget|save|less|afford/.test(t)) {
      const before = estimate(p).total;
      setTier('budget', true);
      const after = estimate(p).total;
      push(c.id, { role: 'zoya', text: `Done. I switched to budget stays and the cheapest good flight. That's <b>${money(after)}</b> per person, down from ${money(before)}.`, attach: { type: 'update', plan: p.id, tab: 'finances', title: 'Switched to budget picks', meta: `${money(after)} per person · ${p.days.length} days` } });
      return;
    }
    if (/food|eat|dinner|lunch|restaurant|pasta|tapas|cook/.test(t)) {
      const used = new Set(p.days.flatMap(d => d.acts.map(a => a.title)));
      const si = p.suggest.findIndex(s => s.food && !used.has(s.title));
      if (si > -1) {
        const day = Math.min(2, p.days.length - 2);
        const a = addAct(p, day, p.suggest[si], 'zoya');
        if (activePlanId === p.id) { renderPanel(); updatePins(false); }
        push(c.id, { role: 'zoya', text: `Added <b>${a.title}</b> to Day ${day + 1}. ${a.desc}`, attach: { type: 'update', plan: p.id, day, act: a, title: a.title, meta: `Day ${day + 1} · ${a.time}` } });
        if (c.kind !== 'group') logEdit(p, `<b>Zoya</b> added <b>${esc(a.title)}</b> to Day ${day + 1}`, day, 'sparkles');
        return;
      }
    }
    if (/day|longer|extend|another|extra/.test(t) && p.days.length < 6) {
      const n = p.days.length + 1;
      const cities = p.days.filter(d => d.kind === 'city');
      const used = new Set(p.days.flatMap(d => d.acts.map(a => a.title)));
      const fill = p.suggest.filter(s => !used.has(s.title)).slice(0, 2).map(s => ({ ...s, by: 'zoya', _fresh: true }));
      cities.push({ kind: 'city', acts: fill });
      p.days = [p.days[0], ...cities, p.days[p.days.length - 1]];
      p.open.add(n - 2);
      if (activePlanId === p.id) { renderPanel(); updatePins(false); }
      push(c.id, { role: 'zoya', text: `Made it ${n} days (${planRange(p)}) and filled the new day with ${fill.length ? fill.map(f => f.title).join(' and ') : 'free time'}.`, attach: { type: 'update', plan: p.id, day: n - 2, title: `Day ${n - 1} added`, meta: planRange(p) } });
      if (c.kind !== 'group') logEdit(p, `<b>Zoya</b> extended the trip to <b>${n} days</b>`, n - 2, 'sparkles');
      return;
    }
    if (/share|invite|friend/.test(t) && !p.shared) {
      push(c.id, { role: 'zoya', text: 'Happy to. Pick who to invite and I\'ll set up a group chat.', chips: [{ label: 'Choose friends', action: 'share' }] });
      return;
    }
    push(c.id, {
      role: 'zoya',
      text: c.kind === 'group' ? `Noted for everyone. I'll keep that in mind for the ${p.name} plan. Want me to change anything?` : `Got it. I'll keep that in mind for your ${p.name} plan. Anything you'd like me to change?`,
      chips: [{ label: 'Make it cheaper', send: 'Make it cheaper' }, { label: 'Add a food experience', send: 'Add a food experience' }, { label: 'Add another day', send: 'Add another day' }],
    });
  });
}

function chipClick(chatId, mi, ci) {
  const c = CHATS[chatId];
  const m = c.messages[mi];
  const chip = m.chips[ci];
  if (chip.action === 'share') { openShareModal(); return; }
  m.chipsUsed = true;
  renderThread(c.id);
  if (chip.action === 'dismiss') return;
  if (chip.action === 'add') {
    const p = PLANS[chip.plan];
    activePlanId = p.id;
    const a = addAct(p, chip.day, p.suggest[chip.idx], 'zoya');
    push(c.id, { role: 'me', text: chip.label, toZoya: c.kind === 'group' });
    later(800, () => {
      push(c.id, { role: 'zoya', text: `Added <b>${a.title}</b> to Day ${chip.day + 1} as the rainy-day plan.`, attach: { type: 'update', plan: p.id, day: chip.day, act: a, title: a.title, meta: `Day ${chip.day + 1} · ${a.time}` } });
      if (document.getElementById('tripPanel').classList.contains('open')) { renderPanel(); updatePins(false); }
    });
    return;
  }
  if (chip.send) {
    if (c.kind === 'group') { push(c.id, { role: 'me', text: chip.send, toZoya: true }); zoyaRespond(c, chip.send); }
    else send(c.id, chip.send);
  }
}

/* ===================== MISC ===================== */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = `${lucide('check', 14)} ${msg}`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function hydrateIcons() {
  document.querySelectorAll('[data-icon]').forEach(el => {
    el.insertAdjacentHTML('afterbegin', lucide(el.dataset.icon, el.classList.contains('rail-icon') ? 20 : 16));
  });
  document.getElementById('railUser').insertAdjacentHTML('beforeend', avatarTooltipHTML(ME));
}

hydrateIcons();
seedChats();
renderChat();
</script>
